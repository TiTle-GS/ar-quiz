<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังข้อสอบ AR - สำหรับนักเรียน</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f0f7ff; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .quiz-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; transition: 0.3s; }
        .quiz-item { background: #fff; border: 2px solid #039be5; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; font-weight: 600; color: #039be5; }
        .quiz-item:hover { background: #039be5; color: white; }
        #viewer-container { width: 100%; height: 300px; background: #000; border-radius: 15px; margin-bottom: 20px; }
        .choice-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #039be5; border-radius: 12px; background: white; cursor: pointer; font-size: 16px; }
        .choice-btn:hover { background: #e3f2fd; }
        #status { color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #039be5;">🌟 คลังข้อสอบ AR</h1>
    
    <div id="quiz-selection">
        <div class="quiz-card">
            <h3>เลือกชุดข้อสอบเพื่อเริ่มทำ</h3>
            <div id="quiz-list">กำลังโหลดคลังข้อสอบ...</div>
            <div id="status"></div>
        </div>
    </div>

    <div id="quiz-play" style="display:none;">
        <div class="quiz-card">
            <div id="viewer-container">
                <model-viewer id="main-v" camera-controls ar shadow-intensity="1" style="width:100%; height:100%;"></model-viewer>
            </div>
            <h2 id="question-text">คำถามจะปรากฏที่นี่</h2>
            <div id="choices-area"></div>
            <p id="progress" style="color: #666;"></p>
        </div>
    </div>
</div>

<script>
    // 🚩 แก้ไข Config ให้เป็นเซิร์ฟเวอร์สิงคโปร์ตามรูปที่ 18
    const firebaseConfig = {
        apiKey: "AIzaSyDBvaBLaqywJ-J3J6hH_UwyF-WmultPim4",
        authDomain: "ar-quizz.firebaseapp.com",
        projectId: "ar-quizz",
        databaseURL: "https://ar-quizz-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "ar-quizz.firebasestorage.app",
        messagingSenderId: "151328581741",
        appId: "1:151328581741:web:d148eaa15b7a24b0dcf764"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🔍 ฟังก์ชันดึงคลังข้อสอบจาก Firebase
    const quizListArea = document.getElementById('quiz-list');
    const statusText = document.getElementById('status');

    db.ref('quizzes').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            quizListArea.innerHTML = "❌ ยังไม่มีข้อสอบในคลัง";
            statusText.innerText = "ตรวจสอบหน้า Admin ว่าบันทึกข้อมูลสำเร็จหรือไม่";
            return;
        }

        quizListArea.innerHTML = ''; // ล้างค่า Loading
        for (let id in data) {
            const item = document.createElement('div');
            item.className = 'quiz-item';
            item.innerText = data[id].name;
            item.onclick = () => startQuiz(data[id].questions);
            quizListArea.appendChild(item);
        }
        statusText.innerText = "โหลดข้อมูลจาก Firebase สำเร็จ (Singapore Server)";
    }, (error) => {
        quizListArea.innerHTML = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อ";
        console.error(error);
    });

    // 🎮 ระบบทำข้อสอบ
    let currentQuestions = [];
    let currentIndex = 0;

    function startQuiz(questions) {
        currentQuestions = questions;
        currentIndex = 0;
        document.getElementById('quiz-selection').style.display = 'none';
        document.getElementById('quiz-play').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            alert("🎉 เก่งมากครับ! ทำข้อสอบครบทุกข้อแล้ว");
            location.reload();
            return;
        }

        const q = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('main-v').src = q.m;
        document.getElementById('progress').innerText = `ข้อที่ ${currentIndex + 1} / ${currentQuestions.length}`;
        
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        
        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt.trim();
            btn.onclick = () => {
                if (opt.trim() === q.a.trim()) {
                    alert("✅ ถูกต้องครับ!");
                    currentIndex++;
                    showQuestion();
                } else {
                    alert("❌ ยังไม่ถูก ลองใหม่อีกครั้งนะครับ");
                }
            };
            area.appendChild(btn);
        });
    }
</script>
</body>
</html>
