<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Admin - AI Model Library</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0288d1; --s: #2e7d32; --bg: #f8fafc; --ai: #6200ea; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn { padding: 10px 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; font-family: 'Sarabun'; }
        .btn-blue { background: var(--p); color: white; }
        .btn-green { background: var(--s); color: white; width: 100%; margin-top: 20px; font-size: 1.1rem; }
        /* สไตล์คลังโมเดล AI */
        .ai-library { position: sticky; top: 20px; height: fit-content; border-left: 4px solid var(--ai); }
        .model-tag { background: #f3e5f5; color: var(--ai); padding: 8px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; border: 1px solid transparent; transition: 0.2s; }
        .model-tag:hover { border-color: var(--ai); background: white; }
        .preview-box { background: #000; height: 200px; border-radius: 10px; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .quiz-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div id="left-panel">
        <div class="card" id="editor-section">
            <h2 id="editor-title" style="color:var(--p); margin-top:0;">➕ สร้าง/แก้ไขข้อสอบ AR</h2>
            <div id="setup-area">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="proj-name" placeholder="ชื่อชุดข้อสอบ">
                    <input type="number" id="q-count" placeholder="กี่ข้อ?" min="1" style="width:100px;">
                    <button class="btn btn-blue" onclick="initQuiz()">เริ่มสร้าง</button>
                </div>
            </div>
            <div id="quiz-area"></div>
            <div id="action-btns" style="display:none; margin-top:20px;">
                <button class="btn btn-green" onclick="saveData()">💾 บันทึกและอัปเดตคลังข้อสอบ</button>
                <button class="btn" style="background:#eee; margin-top:10px; width:100%;" onclick="cancelEdit()">ยกเลิก</button>
            </div>
        </div>

        <div class="card" id="dashboard-section">
            <h3 style="color:var(--s); margin-top:0;">📂 คลังข้อสอบของคุณครู</h3>
            <div id="quiz-list-admin">กำลังโหลด...</div>
        </div>
    </div>

    <div class="ai-library card">
        <h3 style="color:var(--ai); margin-top:0;">🤖 AI Model Library</h3>
        <p style="font-size:12px; color:#666;">คลิกเพื่อใส่โมเดลในข้อสอบที่เลือก</p>
        
        <div style="font-weight:600; margin-bottom:10px; font-size:14px; color:#333;">📚 หมวดหมู่แนะนำ:</div>
        
        <div class="model-tag" onclick="useModel('https://modelviewer.dev/shared-assets/models/Astronaut.glb')">👨‍🚀 นักบินอวกาศ (Science)</div>
        <div class="model-tag" onclick="useModel('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Bee/glTF-Binary/Bee.glb')">🐝 ผึ้ง (Biology)</div>
        <div class="model-tag" onclick="useModel('https://modelviewer.dev/shared-assets/models/RobotExpressive.glb')">🤖 หุ่นยนต์ (Tech)</div>
        <div class="model-tag" onclick="useModel('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/AnatomicalArm/glTF-Binary/AnatomicalArm.glb')">💪 กล้ามเนื้อแขน (Health)</div>
        <div class="model-tag" onclick="useModel('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Lantern/glTF-Binary/Lantern.glb')">🏮 ตะเกียง (History)</div>
        <div class="model-tag" onclick="useModel('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb')">🐤 เป็ดน้อย (Fun)</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDBvaBLaqywJ-J3J6hH_UwyF-WmultPim4",
        authDomain: "ar-quizz.firebaseapp.com",
        projectId: "ar-quizz",
        databaseURL: "https://ar-quizz-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "ar-quizz.firebasestorage.app",
        messagingSenderId: "151328581741",
        appId: "1:151328581741:web:d148eaa15b7a24b0dcf764"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentEditId = null;
    let focusIndex = 0; // จำว่ากำลังเลือกข้อไหน

    // --- ดึงข้อมูลคลัง ---
    function loadDashboard() {
        db.ref('quizzes').on('value', (snapshot) => {
            const data = snapshot.val();
            const listArea = document.getElementById('quiz-list-admin');
            listArea.innerHTML = '';
            if (!data) return listArea.innerHTML = 'ยังไม่มีข้อสอบ';
            for (let id in data) {
                listArea.innerHTML += `
                    <div class="quiz-item">
                        <span><strong>${data[id].name}</strong></span>
                        <div>
                            <button class="btn" style="background:#673ab7; color:white; padding:5px 10px;" onclick="copyId('${id}')">ID</button>
                            <button class="btn" style="background:#ff9800; color:white; padding:5px 10px;" onclick="editQuiz('${id}')">แก้</button>
                            <button class="btn" style="background:#f44336; color:white; padding:5px 10px;" onclick="deleteQuiz('${id}')">ลบ</button>
                        </div>
                    </div>`;
            }
        });
    }

    // --- ใช้โมเดลจาก AI Library ---
    window.useModel = function(url) {
        const input = document.getElementById(`m-${focusIndex}`);
        if(input) {
            input.value = url;
            document.getElementById(`v-${focusIndex}`).src = url;
        } else {
            alert("กรุณากด 'เริ่มสร้าง' เพื่อเปิดฟอร์มก่อนครับ");
        }
    }

    // --- ระบบแก้ไข ---
    window.editQuiz = function(id) {
        db.ref('quizzes/' + id).once('value', (snapshot) => {
            const data = snapshot.val();
            currentEditId = id;
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('editor-title').innerText = "📝 แก้ไข: " + data.name;
            document.getElementById('proj-name').value = data.name;
            document.getElementById('q-count').value = data.questions.length;
            initQuiz(data.questions);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    window.initQuiz = function(existing = null) {
        const n = existing ? existing.length : parseInt(document.getElementById('q-count').value);
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            const d = existing ? existing[i] : {q:'', o:[], a:'', m:''};
            area.innerHTML += `
                <div style="border:1px solid #eee; padding:15px; border-radius:12px; margin-top:15px;" onclick="focusIndex=${i}">
                    <h4 style="color:var(--p); margin:0;">ข้อที่ ${i+1} ${i===0?'(คลิกที่นี่เพื่อเลือกใส่โมเดล)':''}</h4>
                    <textarea id="q-${i}" placeholder="โจทย์">${d.q}</textarea>
                    <input type="text" id="o-${i}" placeholder="ตัวเลือก (แยกด้วยคอมม่า)" value="${d.o.join(',')}">
                    <input type="text" id="a-${i}" placeholder="คำตอบ" value="${d.a}">
                    <input type="text" id="m-${i}" placeholder="ลิงก์โมเดล .glb" value="${d.m}" oninput="document.getElementById('v-${i}').src=this.value">
                    <div class="preview-box"><model-viewer id="v-${i}" src="${d.m}" camera-controls ar shadow-intensity="1" style="width:100%; height:100%;"></model-viewer></div>
                </div>`;
        }
        document.getElementById('action-btns').style.display = 'block';
    }

    window.saveData = async function() {
        const name = document.getElementById('proj-name').value;
        const n = parseInt(document.getElementById('q-count').value);
        const questions = [];
        for(let i=0; i<n; i++) {
            questions.push({
                q: document.getElementById(`q-${i}`).value,
                o: document.getElementById(`o-${i}`).value.split(','),
                a: document.getElementById(`a-${i}`).value,
                m: document.getElementById(`m-${i}`).value
            });
        }
        if (currentEditId) await db.ref('quizzes/' + currentEditId).set({ name, questions });
        else await db.ref('quizzes').push({ name, questions });
        alert("✅ บันทึกสำเร็จ!");
        cancelEdit();
    }

    window.cancelEdit = function() {
        currentEditId = null;
        document.getElementById('dashboard-section').style.display = 'block';
        document.getElementById('setup-area').style.display = 'block';
        document.getElementById('editor-title').innerText = "➕ สร้างชุดข้อสอบใหม่";
        document.getElementById('proj-name').value = "";
        document.getElementById('q-count').value = "";
        document.getElementById('quiz-area').innerHTML = "";
        document.getElementById('action-btns').style.display = "none";
    }

    window.copyId = (id) => { navigator.clipboard.writeText(id); alert("คัดลอก ID แล้ว"); }
    window.deleteQuiz = (id) => { if(confirm('ลบชุดนี้?')) db.ref('quizzes/' + id).remove(); }

    loadDashboard();
</script>
</body>
</html>
