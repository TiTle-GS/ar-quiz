<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Admin Master - จัดการคลังข้อสอบ</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0288d1; --s: #2e7d32; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .quiz-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .quiz-item:last-child { border: none; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-family: 'Sarabun'; transition: 0.2s; }
        .btn-blue { background: var(--p); color: white; }
        .btn-green { background: var(--s); color: white; }
        .btn-copy { background: #ff9800; color: white; margin-left: 5px; }
        .btn-del { background: #ef5350; color: white; }
        .preview-box { background: #000; height: 200px; border-radius: 10px; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .badge { background: #e0f2f1; color: #00695c; padding: 4px 8px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--p);">🪄 AR Admin Master</h1>

    <div class="card">
        <h3>📂 คลังข้อสอบปัจจุบัน</h3>
        <div id="quiz-list-admin">กำลังโหลดข้อมูล...</div>
    </div>

    <div class="card" id="editor-section">
        <h3 id="editor-title">➕ สร้างชุดข้อสอบใหม่</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="proj-name" placeholder="ชื่อชุดข้อสอบ">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" min="1" style="width:100px;">
            <button class="btn btn-blue" onclick="initQuiz()">สร้างฟอร์ม</button>
        </div>
        <div id="quiz-area"></div>
        <button id="save-btn" class="btn btn-green" style="display:none; width:100%; margin-top:20px;" onclick="saveData()">💾 บันทึกข้อมูลลง Firebase</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDBvaBLaqywJ-J3J6hH_UwyF-WmultPim4",
        authDomain: "ar-quizz.firebaseapp.com",
        projectId: "ar-quizz",
        databaseURL: "https://ar-quizz-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "ar-quizz.firebasestorage.app",
        messagingSenderId: "151328581741",
        appId: "1:151328581741:web:d148eaa15b7a24b0dcf764"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 🔍 ฟังก์ชันดึงคลังข้อสอบมาแสดง ---
    function loadDashboard() {
        db.ref('quizzes').on('value', (snapshot) => {
            const data = snapshot.val();
            const listArea = document.getElementById('quiz-list-admin');
            listArea.innerHTML = '';
            if (!data) { listArea.innerHTML = 'ยังไม่มีข้อสอบในคลัง'; return; }

            for (let id in data) {
                listArea.innerHTML += `
                    <div class="quiz-item">
                        <div>
                            <strong>${data[id].name}</strong> <span class="badge">${data[id].questions.length} ข้อ</span><br>
                            <small style="color:gray;">ID: ${id}</small>
                        </div>
                        <div>
                            <button class="btn btn-copy" onclick="copyId('${id}')">📋 คัดลอก ID</button>
                            <button class="btn btn-del" onclick="deleteQuiz('${id}')">🗑️ ลบ</button>
                        </div>
                    </div>`;
            }
        });
    }

    // --- 📋 ฟังก์ชันคัดลอกรหัสข้อสอบ ---
    function copyId(id) {
        navigator.clipboard.writeText(id).then(() => {
            alert("คัดลอกรหัสข้อสอบแล้ว: " + id);
        });
    }

    // --- 🗑️ ฟังก์ชันลบข้อสอบ ---
    function deleteQuiz(id) {
        if(confirm('ยืนยันที่จะลบชุดข้อสอบนี้ใช่หรือไม่?')) {
            db.ref('quizzes/' + id).remove();
        }
    }

    // --- 🛠️ ฟังก์ชันสร้างฟอร์มกรอกข้อมูล ---
    window.initQuiz = function() {
        const n = parseInt(document.getElementById('q-count').value);
        if (isNaN(n) || n <= 0) return alert("โปรดระบุจำนวนข้อตั้งแต่ 1 ขึ้นไป");
        
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div style="border:1px solid #eee; padding:15px; border-radius:10px; margin-top:15px;">
                    <h4>ข้อที่ ${i+1}</h4>
                    <textarea id="q-${i}" placeholder="โจทย์"></textarea>
                    <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)">
                    <input type="text" id="a-${i}" placeholder="คำตอบที่ถูก">
                    <input type="text" id="m-${i}" placeholder="ลิงก์โมเดล Google Drive" oninput="updatePreview(${i}, this.value)">
                    <div class="preview-box"><model-viewer id="v-${i}" camera-controls ar style="width:100%; height:100%;"></model-viewer></div>
                </div>`;
        }
        document.getElementById('save-btn').style.display = 'block';
    }

    window.updatePreview = function(i, url) {
        if(url.includes("drive.google.com")) {
            const fileId = url.split('/d/')[1].split('/')[0];
            const direct = `https://drive.google.com/uc?id=${fileId}`;
            document.getElementById(`v-${i}`).src = direct;
            document.getElementById(`m-${i}`).dataset.real = direct;
        }
    }

    // --- 💾 ฟังก์ชันบันทึก ---
    window.saveData = async function() {
        const name = document.getElementById('proj-name').value;
        const n = parseInt(document.getElementById('q-count').value);
        if(!name) return alert("โปรดระบุชื่อชุดข้อสอบ");

        const questions = [];
        for(let i=0; i<n; i++) {
            questions.push({
                q: document.getElementById(`q-${i}`).value,
                o: document.getElementById(`o-${i}`).value.split(','),
                a: document.getElementById(`a-${i}`).value,
                m: document.getElementById(`m-${i}`).dataset.real || document.getElementById(`m-${i}`).value
            });
        }
        await db.ref('quizzes').push({ name: name, questions: questions });
        alert("บันทึกเข้าคลังสำเร็จ!");
        document.getElementById('quiz-area').innerHTML = '';
        document.getElementById('save-btn').style.display = 'none';
    }

    // เริ่มโหลดข้อมูลทันที
    loadDashboard();
</script>
</body>
</html>
