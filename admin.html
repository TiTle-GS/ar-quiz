<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Admin v5.0 - GitHub Direct Storage</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #8b5cf6; --g: #10b981; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: #eff6ff; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #fff; }
        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; }
        .btn-ai { background: linear-gradient(135deg, var(--p), var(--s)); color: white; }
        .btn-update { background: var(--g); color: white; width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 16px; }
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; background: white; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .preview-pane { background: #000; border-radius: 18px; height: 320px; overflow: hidden; border: 4px solid #f1f5f9; }
        .model-tool-box { background: #f8fafc; padding: 20px; border-radius: 18px; margin-top: 15px; border: 1px dashed var(--p); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--p); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0;">🪄 AR Quiz Intelligent Creator (GitHub Storage)</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อชุดข้อสอบ" style="flex:1; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <button class="btn btn-ai" onclick="initQuiz()">🚀 เริ่มสร้าง</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;">
        <button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกชุดข้อสอบลง Google Sheets</button>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;"></div>
    </div>
</div>

<script>
    // 🔑 การตั้งค่า GitHub และ API (ตรวจสอบความถูกต้อง)
    const GH_USER = "TiTle-GS"; 
    const GH_REPO = "ar-quiz";
    const GH_TOKEN = "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"; 
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmffRx9fH5-XI9aaUfepGWIMSreXKMSS3KsAl9d-0BF3qdEsFeQwg_WjSy4-Jsfe2E4Q/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';

    window.onload = loadList;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        if(!n || n <= 0) return alert("ระบุจำนวนข้อ");
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block">
                    <div>
                        <h3 style="color:var(--p)">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="คำถาม" style="width:100%; height:70px; border-radius:12px; padding:10px; border:1px solid #ddd;"></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)" style="width:100%; margin:8px 0; padding:10px; border-radius:12px; border:1px solid #ddd;">
                        <input type="text" id="a-${i}" placeholder="เฉลย" style="width:100%; padding:10px; border-radius:12px; border:1px solid #ddd;">
                        
                        <div class="model-tool-box">
                            <label style="font-weight:600; color:var(--p);">📦 จัดการโมเดล AR 3D</label>
                            <div style="display:flex; gap:8px; margin:10px 0;">
                                <input type="text" id="p-${i}" placeholder="ค้นหาด้วย AI (English)..." style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd;">
                                <button class="btn btn-ai" onclick="generateModel(${i}, this)">✨ AI</button>
                            </div>
                            <button class="btn" id="upbtn-${i}" style="background:#64748b; color:white; width:100%;" onclick="document.getElementById('file-${i}').click()">📤 อัปโหลดไฟล์ .glb ไป GitHub</button>
                            <input type="file" id="file-${i}" accept=".glb" style="display:none;" onchange="handleGithubUpload(${i}, this)">
                            <input type="text" id="m-${i}" placeholder="URL ของโมเดลจะขึ้นตรงนี้" onchange="preview(${i})" style="width:100%; margin-top:10px; padding:8px; border-radius:10px; border:1px solid #eee; font-size:11px; background:#f1f5f9;">
                        </div>
                    </div>
                    <div class="preview-pane"><model-viewer id="v-${i}" camera-controls ar crossorigin="anonymous" style="width:100%; height:100%;"></model-viewer></div>
                </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    // 🚀 ระบบอัปโหลดไฟล์ไป GitHub โดยตรง
    async function handleGithubUpload(i, input) {
        const file = input.files[0];
        if (!file) return;

        const btn = document.getElementById(`upbtn-${i}`);
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="loader"></span> กำลังส่งไฟล์ไป GitHub...`;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const content = e.target.result.split(',')[1];
            const fileName = `models/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const apiUrl = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${fileName}`;

            try {
                const res = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `token ${GH_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Upload model: ${file.name}`, content: content })
                });

                if (res.ok) {
                    const rawUrl = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/master/${fileName}`;
                    document.getElementById(`m-${i}`).value = rawUrl;
                    preview(i);
                    alert("อัปโหลดสำเร็จ! ไฟล์ถูกเก็บใน GitHub เรียบร้อย");
                } else { throw new Error(); }
            } catch (err) { alert("อัปโหลดไม่สำเร็จ โปรดเช็คสิทธิ์ Token ของคุณครูครับ"); }
            
            btn.disabled = false;
            btn.innerHTML = originalText;
        };
        reader.readAsDataURL(file);
    }

    async function generateModel(i, btn) {
        const p = document.getElementById(`p-${i}`).value;
        if(!p) return alert("ระบุชื่อโมเดลภาษาอังกฤษ");
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span>`;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Find a direct RAW .glb URL for ${p} from KhronosGroup. Return ONLY URL.` }] }] })
            });
            const data = await res.json();
            const url = data.candidates[0].content.parts[0].text.trim().replace(/`/g, "");
            document.getElementById(`m-${i}`).value = url;
            preview(i);
        } catch(e) { alert("AI หาลิงก์ตรงไม่เจอ แนะนำให้อัปโหลดไฟล์เองครับ"); }
        btn.disabled = false; btn.innerHTML = "✨ AI";
    }

    function preview(i) { document.getElementById(`v-${i}`).src = document.getElementById(`m-${i}`).value; }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const qs = [];
        const count = document.getElementById('q-count').value;
        for(let i=0; i<count; i++) {
            qs.push({ q: document.getElementById(`q-${i}`).value, o: document.getElementById(`o-${i}`).value.split(','), a: document.getElementById(`a-${i}`).value, m: document.getElementById(`m-${i}`).value });
        }
        btn.disabled = true; btn.innerHTML = "💾 กำลังบันทึกลง Google Sheets...";
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: "SAVE_QUIZ", id: document.getElementById('current-id').value, name: document.getElementById('proj-name').value, questions: qs })});
            alert("บันทึกสำเร็จ! ข้อมูลใน Google Sheets จะเก็บเพียงลิงก์สั้นๆ ทำให้ไม่มีปัญหาไฟล์ใหญ่");
            loadList();
        } catch(e) { alert("บันทึกไม่สำเร็จ"); }
        btn.disabled = false; btn.innerHTML = "💾 บันทึกชุดข้อสอบลง Google Sheets";
    }

    async function loadList() {
        const res = await fetch(SCRIPT_URL + "?action=list&t=" + Date.now());
        const list = await res.json();
        document.getElementById('project-list').innerHTML = list.map(p => `
            <div class="glass-card" style="margin:0; border-left:6px solid var(--p);">
                <h3>${p.name}</h3><code>ID: ${p.id}</code>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn" style="background:#f1f5f9; flex:1;" onclick="edit('${p.id}')">📝 แก้ไข</button>
                </div>
            </div>`).join('');
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id;
        document.getElementById('proj-name').value = data.name;
        document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => {
            document.getElementById(`q-${i}`).value = q.q;
            document.getElementById(`o-${i}`).value = q.o.join(',');
            document.getElementById(`a-${i}`).value = q.a;
            document.getElementById(`m-${i}`).value = q.m;
            preview(i);
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
</script>
</body>
</html>
