<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Analytics Dashboard - Premium</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #8b5cf6; --g: #10b981; --bg: #f8fafc; --glass: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Sarabun', sans-serif; background: #eff6ff; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.5); }
        
        /* Dashboard Stats */
        .db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin: 20px 0; }
        .stat-card { padding: 24px; border-radius: 20px; text-align: center; color: white; transition: 0.3s; position: relative; overflow: hidden; }
        .stat-card h3 { margin: 0; font-size: 2.8rem; font-weight: 600; }
        .stat-card p { margin: 5px 0 0; opacity: 0.9; font-size: 1.1rem; }

        /* กราฟและตาราง */
        .chart-container { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-top: 20px; }
        .feedback-table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; }
        .feedback-table th { background: #f1f5f9; color: #64748b; padding: 15px; text-align: left; }
        .feedback-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; }

        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; }
        .btn-ai { background: linear-gradient(135deg, var(--p), var(--s)); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-update { background: #10b981; color: white; width: 100%; margin-top: 20px; padding: 16px; font-size: 1.1rem; }
        
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; background: white; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .preview-pane { background: #000; border-radius: 18px; height: 300px; overflow: hidden; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--p); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0; display:flex; align-items:center; gap:10px;">🪄 AR Quiz Intelligent Creator</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อโปรเจกต์ เช่น วิทยาศาสตร์ ม.1" style="flex:1; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <button class="btn btn-ai" onclick="initQuiz()">🚀 เริ่มสร้างฟอร์ม</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;">
        <button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกชุดข้อสอบและอัปเดตระบบ AI</button>
    </div>

    <div id="dashboard-area" class="glass-card" style="display:none; animation: slideIn 0.5s ease-out; border-top: 10px solid var(--p);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h2 style="margin:0; background: linear-gradient(to right, var(--p), var(--s)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🧠 AI Learning Analytics Dashboard</h2>
                <p style="color:#64748b; margin:5px 0 0;">วิเคราะห์พฤติกรรมและการมีส่วนร่วมผ่านเทคโนโลยี AR</p>
            </div>
            <button class="btn" style="background:#f1f5f9;" onclick="document.getElementById('dashboard-area').style.display='none'">✖ ปิด</button>
        </div>
        
        <div class="db-grid" id="stat-summary"></div>
        
        <div class="chart-container">
            <div class="glass-card" style="margin:0; background:white;"><canvas id="scoreChart"></canvas></div>
            <div class="glass-card" style="margin:0; background:white;"><canvas id="behaviorChart"></canvas></div>
        </div>

        <div class="glass-card" style="margin-top:25px; padding:0; overflow:hidden;">
            <table class="feedback-table">
                <thead>
                    <tr><th>ชื่อนักเรียน</th><th>คะแนน</th><th>การโต้ตอบ AR</th><th>บทวิเคราะห์รายบุคคลจาก AI</th></tr>
                </thead>
                <tbody id="feedback-tbody"></tbody>
            </table>
        </div>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;">
            กำลังเชื่อมต่อคลังข้อมูล...
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc4enXMM2nafJmpuXJBgsbgnNaJB1-vih0MbRYjQq3gmX-sc3RzsnxFXrxpNftBgkLTA/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';
    let scoreChart, behaviorChart;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        if(!n || n <= 0) return alert("ระบุจำนวนข้อก่อนครับ");
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block">
                    <div>
                        <h3 style="color:var(--p); margin-top:0;">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="คำถาม..." style="width:100%; height:80px; border-radius:12px; padding:12px; border:1px solid #ddd;"></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)" style="width:100%; margin:10px 0; padding:12px; border-radius:12px; border:1px solid #ddd;">
                        <input type="text" id="a-${i}" placeholder="เฉลย" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd;">
                        <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-top:15px;">
                            <input type="text" id="p-${i}" placeholder="AI Search: เช่น หัวใจ 3D" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd;">
                            <button class="btn btn-ai" style="width:100%; margin-top:10px;" onclick="generateModel(${i}, this)">✨ ค้นหาโมเดลด้วย AI</button>
                        </div>
                        <input type="text" id="m-${i}" placeholder="URL .glb" onchange="preview(${i})" style="width:100%; margin-top:10px; padding:12px; border-radius:12px; border:1px solid #ddd;">
                    </div>
                    <div class="preview-pane">
                        <model-viewer id="v-${i}" camera-controls ar crossorigin="anonymous" style="width:100%; height:100%;"></model-viewer>
                    </div>
                </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    async function generateModel(i, btn) {
        const p = document.getElementById(`p-${i}`).value;
        if(!p) return alert("ระบุชื่อสิ่งที่ต้องการค้นหา");
        const originalText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span> กำลังค้นหา...`;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Find a direct .glb raw URL for ${p} from KhronosGroup. Return ONLY the URL string.` }] }] })
            });
            const data = await res.json();
            const url = data.candidates[0].content.parts[0].text.trim();
            document.getElementById(`m-${i}`).value = url;
            preview(i);
        } catch(e) { alert("AI หาไม่เจอ ลองเปลี่ยนคำค้นหา"); }
        btn.disabled = false; btn.innerHTML = originalText;
    }

    function preview(i) { document.getElementById(`v-${i}`).src = document.getElementById(`m-${i}`).value; }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const n = document.getElementById('q-count').value;
        const qs = [];
        for(let i=0; i<n; i++) {
            qs.push({ q: document.getElementById(`q-${i}`).value, o: document.getElementById(`o-${i}`).value.split(','), a: document.getElementById(`a-${i}`).value, m: document.getElementById(`m-${i}`).value });
        }
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span> กำลังบันทึก...`;
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: "SAVE_QUIZ", id: document.getElementById('current-id').value, name: document.getElementById('proj-name').value, questions: qs })});
            alert("บันทึกสำเร็จ!");
            loadList();
        } catch(e) { alert("ล้มเหลว"); }
        btn.disabled = false; btn.innerHTML = "💾 บันทึกและอัปเดตระบบ AI";
    }

    async function loadList() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=list");
            const list = await res.json();
            document.getElementById('project-list').innerHTML = list.map(p => `
                <div class="glass-card" style="margin:0; border-left: 6px solid var(--p);">
                    <h3 style="margin:0 0 10px 0;">${p.name}</h3>
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
                        <code style="background:#f1f5f9; padding:5px 12px; border-radius:10px; font-weight:bold; color:var(--p);">${p.id}</code>
                        <button class="btn" style="background:#f1f5f9; font-size:12px;" onclick="copyID('${p.id}')">📋 คัดลอก ID</button>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-ai" style="flex:1" onclick="analyzeID('${p.id}')">📊 AI Analytics</button>
                        <button class="btn" style="background:#f1f5f9" onclick="edit('${p.id}')">📝 แก้ไข</button>
                    </div>
                </div>`).join('');
        } catch(e) { document.getElementById('project-list').innerHTML = "ยังไม่มีข้อมูล"; }
    }

    function copyID(id) { navigator.clipboard.writeText(id); alert("คัดลอกรหัส " + id + " แล้ว!"); }

    async function analyzeID(id) {
        document.getElementById('dashboard-area').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        try {
            const res = await fetch(SCRIPT_URL + "?action=getAnalytics&id=" + id);
            const data = await res.json();
            
            // 1. Stats
            const total = data.length;
            const avg = (data.reduce((s, r) => s + parseInt(r.score), 0) / total).toFixed(1);
            const totalInt = data.reduce((s, r) => s + parseInt(r.interacts), 0);
            
            document.getElementById('stat-summary').innerHTML = `
                <div class="stat-card" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);"><h3>${total}</h3><p>นักเรียนทั้งหมด</p></div>
                <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);"><h3>${avg}</h3><p>คะแนนเฉลี่ย</p></div>
                <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);"><h3>${totalInt}</h3><p>การโต้ตอบ AR รวม</p></div>
            `;

            // 2. Charts
            if(scoreChart) scoreChart.destroy();
            scoreChart = new Chart(document.getElementById('scoreChart'), {
                type: 'bar',
                data: { labels: data.map(r => r.name), datasets: [{ label: 'คะแนนรายบุคคล', data: data.map(r => r.score), backgroundColor: '#6366f1', borderRadius: 10 }] },
                options: { plugins: { legend: { display: false } } }
            });

            if(behaviorChart) behaviorChart.destroy();
            const behaviors = { "Explorer": 0, "Hesitant": 0, "Impulsive": 0, "Standard": 0 };
            data.forEach(r => {
                if(r.ai_summary.includes("Active")) behaviors.Explorer++;
                else if(r.ai_summary.includes("Hesitant")) behaviors.Hesitant++;
                else if(r.ai_summary.includes("Impulsive")) behaviors.Impulsive++;
                else behaviors.Standard++;
            });
            behaviorChart = new Chart(document.getElementById('behaviorChart'), {
                type: 'doughnut',
                data: { labels: ['สายสำรวจ', 'สายลังเล', 'สายรีบ', 'ปกติ'], datasets: [{ data: Object.values(behaviors), backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#6366f1'] }] }
            });

            // 3. Table
            document.getElementById('feedback-tbody').innerHTML = data.map(r => `
                <tr><td><b>${r.name}</b></td><td><span style="background:#e0e7ff; color:#4338ca; padding:5px 12px; border-radius:12px; font-weight:bold;">${r.score}</span></td><td>${r.interacts} ครั้ง</td><td style="font-size:14px;">${r.ai_summary}</td></tr>
            `).join('');

        } catch(e) { alert("ยังไม่มีข้อมูลนักเรียนรหัสนี้"); }
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id;
        document.getElementById('proj-name').value = data.name;
        document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => {
            document.getElementById(`q-${i}`).value = q.q;
            document.getElementById(`o-${i}`).value = q.o.join(',');
            document.getElementById(`a-${i}`).value = q.a;
            document.getElementById(`m-${i}`).value = q.m;
            preview(i);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    loadList();
</script>
</body>
</html>
