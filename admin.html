<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Admin Dashboard - Premium</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #8b5cf6; --g: #10b981; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: #eff6ff; margin: 0; padding: 20px; }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #fff; }
        .stat-card { padding: 20px; border-radius: 20px; text-align: center; color: white; transition: 0.3s; }
        .db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; }
        .btn-ai { background: linear-gradient(135deg, var(--p), var(--s)); color: white; }
        .btn-update { background: #10b981; color: white; width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 16px; }
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; background: white; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .preview-pane { background: #000; border-radius: 18px; height: 300px; overflow: hidden; }
        .feedback-table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; margin-top: 20px; }
        .feedback-table td, .feedback-table th { padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: left; }
    </style>
</head>
<body>

<div class="container" style="max-width:1200px; margin:0 auto;">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0;">🪄 AR Quiz Intelligent Creator</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อโปรเจกต์ เช่น วิทยาศาสตร์ ม.1" style="flex:1; padding:15px; border-radius:15px; border:1px solid #ddd;">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px; padding:15px; border-radius:15px; border:1px solid #ddd;">
            <button class="btn btn-ai" onclick="initQuiz()">🚀 เริ่มสร้างฟอร์ม</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;"><button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกชุดข้อสอบและอัปเดตระบบ AI</button></div>

    <div id="dashboard-area" class="glass-card" style="display:none; border-top: 10px solid var(--p);">
        <h2 style="margin:0; background: linear-gradient(to right, var(--p), var(--s)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🧠 AI Learning Analytics Dashboard</h2>
        <div class="db-grid" id="stat-summary" style="margin: 20px 0;"></div>
        <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px;">
            <div class="glass-card" style="margin:0; background:white;"><canvas id="scoreChart"></canvas></div>
            <div class="glass-card" style="margin:0; background:white;"><canvas id="behaviorChart"></canvas></div>
        </div>
        <table class="feedback-table">
            <thead><tr><th>ชื่อนักเรียน</th><th>คะแนน</th><th>การโต้ตอบ AR</th><th>บทวิเคราะห์ AI</th></tr></thead>
            <tbody id="feedback-tbody"></tbody>
        </table>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc4enXMM2nafJmpuXJBgsbgnNaJB1-vih0MbRYjQq3gmX-sc3RzsnxFXrxpNftBgkLTA/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';
    let scoreChart, behaviorChart;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `<div class="glass-card q-block">
                <div>
                    <h3 style="color:var(--p)">ข้อที่ ${i+1}</h3>
                    <textarea id="q-${i}" placeholder="คำถาม" style="width:100%; height:70px; border-radius:12px; padding:10px; border:1px solid #ddd;"></textarea>
                    <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)" style="width:100%; margin:8px 0; padding:10px; border-radius:12px; border:1px solid #ddd;">
                    <input type="text" id="a-${i}" placeholder="เฉลย" style="width:100%; padding:10px; border-radius:12px; border:1px solid #ddd;">
                    <input type="text" id="p-${i}" placeholder="AI Search" style="width:100%; margin-top:10px; padding:10px; border-radius:12px; border:1px solid #ddd;">
                    <button class="btn btn-ai" style="width:100%; margin-top:10px;" onclick="generateModel(${i}, this)">✨ ค้นหาโมเดล</button>
                    <input type="text" id="m-${i}" placeholder="URL .glb" onchange="preview(${i})" style="width:100%; margin-top:10px; padding:10px; border-radius:12px; border:1px solid #ddd;">
                </div>
                <div class="preview-pane"><model-viewer id="v-${i}" camera-controls ar crossorigin="anonymous" style="width:100%; height:100%;"></model-viewer></div>
            </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    async function generateModel(i, btn) {
        const p = document.getElementById(`p-${i}`).value;
        btn.disabled = true; btn.innerText = "กำลังค้นหา...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Find a direct .glb URL for ${p} from KhronosGroup. Return ONLY URL.` }] }] })
            });
            const data = await res.json();
            document.getElementById(`m-${i}`).value = data.candidates[0].content.parts[0].text.trim();
            preview(i);
        } catch(e) { alert("หาไม่เจอ"); }
        btn.disabled = false; btn.innerText = "✨ ค้นหาโมเดล";
    }

    function preview(i) { document.getElementById(`v-${i}`).src = document.getElementById(`m-${i}`).value; }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const qs = [];
        for(let i=0; i<document.getElementById('q-count').value; i++) {
            qs.push({ q: document.getElementById(`q-${i}`).value, o: document.getElementById(`o-${i}`).value.split(','), a: document.getElementById(`a-${i}`).value, m: document.getElementById(`m-${i}`).value });
        }
        btn.disabled = true; btn.innerText = "กำลังบันทึก...";
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: "SAVE_QUIZ", id: document.getElementById('current-id').value, name: document.getElementById('proj-name').value, questions: qs })});
        alert("บันทึกสำเร็จ!"); loadList();
        btn.disabled = false; btn.innerText = "💾 บันทึกชุดข้อสอบ";
    }

    async function loadList() {
        const res = await fetch(SCRIPT_URL + "?action=list");
        const list = await res.json();
        document.getElementById('project-list').innerHTML = list.map(p => `<div class="glass-card" style="margin:0; border-left:6px solid var(--p);">
            <h3>${p.name}</h3><code style="color:var(--p); font-weight:bold;">ID: ${p.id}</code>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-ai" style="flex:1" onclick="analyzeID('${p.id}')">📊 AI Analytics</button>
                <button class="btn" style="background:#f1f5f9" onclick="edit('${p.id}')">📝</button>
                <button class="btn" style="background:#fee2e2; color:#ef4444" onclick="deleteProj('${p.id}')">🗑️</button>
            </div>
        </div>`).join('');
    }

    async function analyzeID(id) {
        document.getElementById('dashboard-area').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const res = await fetch(SCRIPT_URL + "?action=getAnalytics&id=" + id);
        const data = await res.json();
        const total = data.length;
        const avg = (data.reduce((s, r) => s + parseInt(r.score), 0) / total).toFixed(1);
        document.getElementById('stat-summary').innerHTML = `
            <div class="stat-card" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);"><h3>${total}</h3><p>นักเรียนทั้งหมด</p></div>
            <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);"><h3>${avg}</h3><p>คะแนนเฉลี่ย</p></div>
        `;
        if(scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
            type: 'bar', data: { labels: data.map(r => r.name), datasets: [{ label: 'คะแนน', data: data.map(r => r.score), backgroundColor: '#6366f1', borderRadius: 10 }] }
        });
        const behaviors = { "Explorer": 0, "Hesitant": 0, "Impulsive": 0, "Standard": 0 };
        data.forEach(r => { if(r.ai_summary.includes("Active")) behaviors.Explorer++; else if(r.ai_summary.includes("Hesitant")) behaviors.Hesitant++; else if(r.ai_summary.includes("Impulsive")) behaviors.Impulsive++; else behaviors.Standard++; });
        if(behaviorChart) behaviorChart.destroy();
        behaviorChart = new Chart(document.getElementById('behaviorChart'), {
            type: 'doughnut', data: { labels: ['สำรวจ', 'ลังเล', 'รีบ', 'ปกติ'], datasets: [{ data: Object.values(behaviors), backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#6366f1'] }] }
        });
        document.getElementById('feedback-tbody').innerHTML = data.map(r => `<tr><td><b>${r.name}</b></td><td>${r.score}</td><td>${r.interacts}</td><td>${r.ai_summary}</td></tr>`).join('');
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id; document.getElementById('proj-name').value = data.name; document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => { document.getElementById(`q-${i}`).value = q.q; document.getElementById(`o-${i}`).value = q.o.join(','); document.getElementById(`a-${i}`).value = q.a; document.getElementById(`m-${i}`).value = q.m; preview(i); });
    }

    async function deleteProj(id) { if(confirm('ลบ?')) { await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({type: "DELETE_QUIZ", id: id}) }); loadList(); } }
    loadList();
</script>
</body>
</html>
