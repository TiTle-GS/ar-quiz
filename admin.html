<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Admin Dashboard (v3.1)</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #8e44ad; --s: #3498db; --g: #2ecc71; --d: #e74c3c; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin: 20px 0; }
        .stat-card { padding: 20px; border-radius: 16px; text-align: center; color: white; transition: 0.3s; }
        .stat-card h3 { margin: 0; font-size: 2.5rem; font-weight: 600; }
        .stat-card p { margin: 5px 0 0; opacity: 0.9; }
        .btn { padding: 10px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; }
        .btn-copy { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-ai { background: linear-gradient(135deg, #7c3aed, #3b82f6); color: white; }
        .btn-update { background: var(--g); color: white; width: 100%; font-size: 1.1rem; padding: 15px; margin-top: 20px; }
        .feedback-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .feedback-table th, .feedback-table td { padding: 16px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #dcfce7; color: #166534; }
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; border: 1px solid #f1f5f9; border-radius: 16px; margin-bottom: 20px; }
        .preview-pane { background: #000; border-radius: 12px; height: 300px; overflow: hidden; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--p); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0;">🪄 AR Intelligent Creator</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อโปรเจกต์ เช่น วิทยาศาสตร์ ม.1" style="flex:1; padding:14px; border-radius:12px; border:1px solid #ddd;">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px; padding:14px; border-radius:12px; border:1px solid #ddd;">
            <button class="btn btn-ai" onclick="initQuiz()">สร้างชุดข้อสอบ</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;">
        <button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกและอัปเดตระบบ AI</button>
    </div>

    <div id="dashboard-area" class="glass-card" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color:var(--p); margin:0;">🧠 AI Analytics Dashboard</h2>
            <button class="btn btn-copy" onclick="document.getElementById('dashboard-area').style.display='none'">ปิด</button>
        </div>
        <div class="db-grid" id="stat-summary"></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="glass-card" style="margin:0;"><canvas id="scoreChart"></canvas></div>
            <div class="glass-card" style="margin:0; overflow-y: auto; max-height: 400px;">
                <h3>📋 รายงานรายบุคคล</h3>
                <table class="feedback-table" id="feedback-list">
                    <thead><tr><th>ชื่อ</th><th>คะแนน</th><th>AI Summary</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
            กำลังโหลดข้อมูลคลังข้อสอบ...
        </div>
    </div>
</div>

<script>
    // ✅ อัปเดต URL และ API KEY เรียบร้อยแล้ว
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypucidAspLcPKEeg-ZOVyJAuHE2wHvgaIrtbeLuZZde1XCx3oEjLsauC2-bvfiuWHPAw/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';
    let myChart = null;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        if(!n || n <= 0) return alert("ระบุจำนวนข้อก่อนครับ");
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block">
                    <div>
                        <h3 style="color:var(--p); margin-top:0;">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="คำถาม" style="width:100%; height:70px; border-radius:10px; padding:10px; border:1px solid #ddd;"></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)" style="width:100%; margin:8px 0; padding:10px; border-radius:10px; border:1px solid #ddd;">
                        <input type="text" id="a-${i}" placeholder="เฉลย" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;">
                        <div style="background:#f1f5f9; padding:15px; border-radius:12px; margin-top:15px;">
                            <input type="text" id="p-${i}" placeholder="AI Search: เช่น หัวใจ 3D" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;">
                            <button class="btn btn-ai" style="width:100%; margin-top:8px;" onclick="generateModel(${i}, this)">✨ ค้นหาโมเดลด้วย AI</button>
                        </div>
                        <input type="text" id="m-${i}" placeholder="URL .glb" onchange="preview(${i})" style="width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1px solid #ddd;">
                    </div>
                    <div class="preview-pane">
                        <model-viewer id="v-${i}" camera-controls ar crossorigin="anonymous" style="width:100%; height:100%;"></model-viewer>
                    </div>
                </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    async function generateModel(i, btn) {
        const p = document.getElementById(`p-${i}`).value;
        if(!p) return alert("ระบุชื่อสิ่งที่ต้องการค้นหา");
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span> กำลังค้นหา...`;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Find a direct .glb raw URL for ${p} from KhronosGroup. Return ONLY the URL string.` }] }] })
            });
            const data = await res.json();
            const url = data.candidates[0].content.parts[0].text.trim();
            document.getElementById(`m-${i}`).value = url;
            preview(i);
        } catch(e) { alert("AI หาไม่เจอ ลองเปลี่ยนคำค้นหา"); }
        btn.disabled = false; btn.innerHTML = "✨ ค้นหาโมเดลด้วย AI";
    }

    function preview(i) { document.getElementById(`v-${i}`).src = document.getElementById(`m-${i}`).value; }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const n = document.getElementById('q-count').value;
        const qs = [];
        for(let i=0; i<n; i++) {
            qs.push({ q: document.getElementById(`q-${i}`).value, o: document.getElementById(`o-${i}`).value.split(','), a: document.getElementById(`a-${i}`).value, m: document.getElementById(`m-${i}`).value });
        }
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span> กำลังบันทึก...`;
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: "SAVE_QUIZ", id: document.getElementById('current-id').value, name: document.getElementById('proj-name').value, questions: qs })});
            alert("บันทึกสำเร็จ!");
            loadList();
        } catch(e) { alert("ล้มเหลว"); }
        btn.disabled = false; btn.innerHTML = "💾 บันทึกและอัปเดตระบบ AI";
    }

    async function loadList() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=list");
            const list = await res.json();
            document.getElementById('project-list').innerHTML = list.map(p => `
                <div class="glass-card" style="margin:0; border-left: 6px solid var(--p);">
                    <h3 style="margin:0 0 10px 0;">${p.name}</h3>
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
                        <code style="background:#f1f5f9; padding:5px 10px; border-radius:8px; font-weight:bold; color:var(--p);">${p.id}</code>
                        <button class="btn btn-copy" onclick="copyID('${p.id}')">📋 คัดลอก ID</button>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-ai" style="flex:1" onclick="analyzeID('${p.id}')">📊 AI วิเคราะห์ผล</button>
                        <button class="btn btn-copy" onclick="edit('${p.id}')">📝</button>
                    </div>
                </div>`).join('');
        } catch(e) { document.getElementById('project-list').innerHTML = "ยังไม่มีข้อมูล"; }
    }

    function copyID(id) { navigator.clipboard.writeText(id); alert("คัดลอกรหัส " + id + " แล้ว!"); }

    async function analyzeID(id) {
        document.getElementById('dashboard-area').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        try {
            const res = await fetch(SCRIPT_URL + "?action=getAnalytics&id=" + id);
            const data = await res.json();
            if(data.length === 0) return alert("ยังไม่มีข้อมูลการสอบ");
            document.getElementById('stat-summary').innerHTML = `<div class="stat-card" style="background:var(--p)"><h3>${data.length}</h3><p>นักเรียนที่สอบแล้ว</p></div>`;
            const tbody = document.querySelector('#feedback-list tbody');
            tbody.innerHTML = data.map(r => `<tr><td><b>${r.name}</b></td><td><span class="badge">${r.score}</span></td><td style="font-size:13px;">${r.ai_summary}</td></tr>`).join('');
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'bar', data: { labels: data.map(r => r.name), datasets: [{ label: 'คะแนน', data: data.map(r => parseInt(r.score)), backgroundColor: 'rgba(142, 68, 173, 0.6)' }] } });
        } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ"); }
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id;
        document.getElementById('proj-name').value = data.name;
        document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => {
            document.getElementById(`q-${i}`).value = q.q;
            document.getElementById(`o-${i}`).value = q.o.join(',');
            document.getElementById(`a-${i}`).value = q.a;
            document.getElementById(`m-${i}`).value = q.m;
            preview(i);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadList();
</script>
</body>
</html>
