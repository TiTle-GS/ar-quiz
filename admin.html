<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Admin Dashboard v4.5 - All-in-One</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #8b5cf6; --g: #10b981; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #fff; }
        
        /* Stats Dashboard */
        .db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { padding: 24px; border-radius: 20px; text-align: center; color: white; }
        .stat-card h3 { margin: 0; font-size: 2.5rem; font-weight: 600; }
        
        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; }
        .btn-ai { background: linear-gradient(135deg, var(--p), var(--s)); color: white; }
        .btn-upload { background: #64748b; color: white; }
        .btn-update { background: var(--g); color: white; width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 16px; }
        
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; background: white; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .preview-pane { background: #000; border-radius: 18px; height: 320px; overflow: hidden; border: 4px solid #f1f5f9; }
        
        .model-tool-box { background: #f8fafc; padding: 20px; border-radius: 18px; margin-top: 15px; border: 1px dashed var(--p); }
        .feedback-table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; margin-top: 20px; }
        .feedback-table th { background: #f1f5f9; color: #64748b; padding: 15px; text-align: left; }
        .feedback-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--p); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0;">🪄 AR Quiz Intelligent Creator</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อวิชา/ชุดข้อสอบ" style="flex:1; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px; padding:15px; border-radius:15px; border:1px solid #ddd; outline:none;">
            <button class="btn btn-ai" onclick="initQuiz()">🚀 สร้างชุดข้อสอบ</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;">
        <button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกชุดข้อสอบและอัปเดตระบบ AI</button>
    </div>

    <div id="dashboard-area" class="glass-card" style="display:none; border-top: 10px solid var(--p);">
        <h2 style="margin:0; background: linear-gradient(to right, var(--p), var(--s)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🧠 AI Learning Analytics Dashboard</h2>
        <div class="db-grid" id="stat-summary" style="margin-top:20px;"></div>
        <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px;">
            <div class="glass-card" style="margin:0; background:white;"><canvas id="scoreChart"></canvas></div>
            <div class="glass-card" style="margin:0; background:white;"><canvas id="behaviorChart"></canvas></div>
        </div>
        <table class="feedback-table">
            <thead><tr><th>ชื่อนักเรียน</th><th>คะแนน</th><th>การโต้ตอบ AR</th><th>บทวิเคราะห์ AI</th></tr></thead>
            <tbody id="feedback-tbody"></tbody>
        </table>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;"></div>
    </div>
</div>

<script>
    // 🔗 ตั้งค่าการเชื่อมต่อ (เช็คลิงก์ให้ถูกต้อง)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc4enXMM2nafJmpuXJBgsbgnNaJB1-vih0MbRYjQq3gmX-sc3RzsnxFXrxpNftBgkLTA/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';
    let scoreChart, behaviorChart;

    window.onload = loadList;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        if(!n || n <= 0) return alert("ระบุจำนวนข้อก่อนครับ");
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block">
                    <div>
                        <h3 style="color:var(--p)">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="โจทย์คำถาม..." style="width:100%; height:70px; border-radius:12px; padding:10px; border:1px solid #ddd;"></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก,ข,ค,ง)" style="width:100%; margin:8px 0; padding:10px; border-radius:12px; border:1px solid #ddd;">
                        <input type="text" id="a-${i}" placeholder="เฉลยที่ถูกต้อง" style="width:100%; padding:10px; border-radius:12px; border:1px solid #ddd;">
                        
                        <div class="model-tool-box">
                            <label style="font-weight:600; color:var(--p); font-size:14px;">📦 จัดการโมเดล AR 3D</label>
                            <div style="display:flex; gap:8px; margin:10px 0;">
                                <input type="text" id="p-${i}" placeholder="พิมพ์ชื่อสิ่งของ (English)..." style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd;">
                                <button class="btn btn-ai" onclick="generateModel(${i}, this)">✨ AI หาลิงก์</button>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn-upload" style="flex:1" onclick="document.getElementById('file-${i}').click()">📤 อัปโหลด .glb เอง</button>
                                <input type="file" id="file-${i}" accept=".glb" style="display:none;" onchange="handleFileUpload(${i}, this)">
                            </div>
                            <input type="text" id="m-${i}" placeholder="URL ไฟล์ .glb" onchange="preview(${i})" style="width:100%; margin-top:10px; padding:8px; border-radius:10px; border:1px solid #eee; font-size:11px; background:#f1f5f9;">
                        </div>
                    </div>
                    <div class="preview-pane">
                        <model-viewer id="v-${i}" camera-controls ar crossorigin="anonymous" style="width:100%; height:100%;"></model-viewer>
                    </div>
                </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    // ✨ ฟังก์ชัน AI ค้นหาลิงก์ตรง (.glb)
    async function generateModel(i, btn) {
        const p = document.getElementById(`p-${i}`).value;
        if(!p) return alert("ระบุชื่อโมเดลเป็นภาษาอังกฤษ");
        const originalText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = `<span class="loader"></span>`;
        
        const prompt = `Find a direct public RAW .glb file URL for "${p}". Must end with .glb. Return ONLY the URL string. No markdown.`;
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const url = data.candidates[0].content.parts[0].text.trim().replace(/`/g, "");
            if(url.includes(".glb")) {
                document.getElementById(`m-${i}`).value = url;
                preview(i);
            } else { alert("AI หาลิงก์ตรงไม่เจอ ลองใช้ปุ่มอัปโหลดแทนครับ"); }
        } catch(e) { alert("เกิดข้อผิดพลาดในการค้นหา"); }
        btn.disabled = false; btn.innerHTML = originalText;
    }

    // 📤 ฟังก์ชันอัปโหลดไฟล์จากเครื่อง (Base64)
    function handleFileUpload(i, input) {
        const file = input.files[0];
        if (file) {
            if (file.size > 2 * 1024 * 1024) return alert("ไฟล์ต้องไม่เกิน 2MB ครับ");
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(`m-${i}`).value = e.target.result;
                preview(i);
                alert("อัปโหลดไฟล์สำเร็จ!");
            };
            reader.readAsDataURL(file);
        }
    }

    function preview(i) { document.getElementById(`v-${i}`).src = document.getElementById(`m-${i}`).value; }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const qs = [];
        for(let i=0; i<document.getElementById('q-count').value; i++) {
            qs.push({ q: document.getElementById(`q-${i}`).value, o: document.getElementById(`o-${i}`).value.split(','), a: document.getElementById(`a-${i}`).value, m: document.getElementById(`m-${i}`).value });
        }
        btn.disabled = true; btn.innerHTML = "กำลังบันทึก...";
        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ type: "SAVE_QUIZ", id: document.getElementById('current-id').value, name: document.getElementById('proj-name').value, questions: qs })});
            alert("บันทึกสำเร็จ!"); loadList();
        } catch(e) { alert("บันทึกไม่สำเร็จ เช็คการ Deploy"); }
        btn.disabled = false; btn.innerHTML = "💾 บันทึกชุดข้อสอบและอัปเดตระบบ AI";
    }

    async function loadList() {
        const area = document.getElementById('project-list');
        try {
            const res = await fetch(SCRIPT_URL + "?action=list&t=" + new Date().getTime());
            const list = await res.json();
            area.innerHTML = list.map(p => `
                <div class="glass-card" style="margin:0; border-left:6px solid var(--p);">
                    <h3 style="margin:0">${p.name}</h3><code>ID: ${p.id}</code>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-ai" style="flex:1" onclick="analyzeID('${p.id}')">📊 Analytics</button>
                        <button class="btn" style="background:#f1f5f9" onclick="edit('${p.id}')">📝 แก้ไข</button>
                    </div>
                </div>`).join('');
        } catch(e) { area.innerHTML = "ยังไม่มีข้อสอบในคลัง"; }
    }

    async function analyzeID(id) {
        document.getElementById('dashboard-area').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const res = await fetch(SCRIPT_URL + "?action=getAnalytics&id=" + id);
        const data = await res.json();
        
        const total = data.length;
        const avg = (data.reduce((s, r) => s + parseInt(r.score), 0) / total).toFixed(1);
        document.getElementById('stat-summary').innerHTML = `
            <div class="stat-card" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);"><h3>${total}</h3><p>นักเรียนทั้งหมด</p></div>
            <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);"><h3>${avg}</h3><p>คะแนนเฉลี่ย</p></div>
        `;

        if(scoreChart) scoreChart.destroy();
        scoreChart = new Chart(document.getElementById('scoreChart'), {
            type: 'bar', data: { labels: data.map(r => r.name), datasets: [{ label: 'คะแนน', data: data.map(r => r.score), backgroundColor: '#6366f1', borderRadius: 10 }] },
            options: { scales: { y: { beginAtZero: true, max: 10 } } }
        });

        const behaviors = { "Explorer": 0, "Hesitant": 0, "Impulsive": 0, "Standard": 0 };
        data.forEach(r => { if(r.ai_summary.includes("Active")) behaviors.Explorer++; else if(r.ai_summary.includes("Hesitant")) behaviors.Hesitant++; else if(r.ai_summary.includes("Impulsive")) behaviors.Impulsive++; else behaviors.Standard++; });
        if(behaviorChart) behaviorChart.destroy();
        behaviorChart = new Chart(document.getElementById('behaviorChart'), {
            type: 'doughnut', data: { labels: ['สายสำรวจ', 'สายลังเล', 'สายรีบ', 'ปกติ'], datasets: [{ data: Object.values(behaviors), backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#6366f1'] }] }
        });

        document.getElementById('feedback-tbody').innerHTML = data.map(r => `
            <tr><td><b>${r.name}</b></td><td><b style="color:var(--p)">${r.score}</b></td><td>${r.interacts} ครั้ง</td><td style="font-size:13px;">${r.ai_summary}</td></tr>
        `).join('');
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id;
        document.getElementById('proj-name').value = data.name;
        document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => {
            document.getElementById(`q-${i}`).value = q.q;
            document.getElementById(`o-${i}`).value = q.o.join(',');
            document.getElementById(`a-${i}`).value = q.a;
            document.getElementById(`m-${i}`).value = q.m;
            preview(i);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
