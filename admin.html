<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AR Quiz — Admin</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; color:#222; margin:0; padding:20px; }
    .wrap { max-width:1100px; margin:0 auto; background:#fff; padding:18px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
    h2 { margin-top:0; }
    .grid { display:grid; grid-template-columns: 1fr 360px; gap:18px; align-items:start; }
    .card { padding:12px; border-radius:8px; background:#fbfdff; border:1px solid #eef5ff; }
    input, textarea, select, button { width:100%; padding:8px; margin-top:8px; box-sizing:border-box; }
    .small { font-size:13px; color:#666; }
    .quiz-list { max-height:420px; overflow:auto; }
    .quiz-item { padding:8px; border-bottom:1px solid #eef5ff; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .btn { padding:8px 10px; border:none; border-radius:6px; cursor:pointer; }
    .btn-primary { background:#2b7cff; color:#fff; }
    .btn-danger { background:#ff6b6b; color:#fff; }
    .btn-ghost { background:#f1f5fb; color:#333; }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h2>AR Quiz — Admin</h2>
    <div class="grid">
      <div>
        <div class="card">
          <h3>สร้าง / แก้ไขชุดข้อสอบ</h3>
          <label>ชื่อชุดข้อสอบ</label>
          <input id="quiz-name" placeholder="เช่น วิทย์-ระบบสุริยะ-ม.1" />
          <label>จำนวนข้อ</label>
          <input id="quiz-count" type="number" min="1" value="4" />
          <div id="questions-area" style="margin-top:12px;"></div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button id="save-quiz" class="btn btn-primary">💾 บันทึกชุดข้อสอบ</button>
            <button id="clear-form" class="btn btn-ghost">ล้าง</button>
          </div>
          <p class="small">หมายเหตุ: ใช้ลิงก์ไฟล์ .glb ที่เป็น direct download หรือ raw.githubusercontent.com</p>
        </div>

        <div class="card" style="margin-top:12px;">
          <h3>ทดสอบโมเดล AR (ตัวอย่าง)</h3>
          <label>วางลิงก์ .glb</label>
          <input id="test-model-url" placeholder="https://raw.githubusercontent.com/..." />
          <div style="margin-top:8px;">
            <model-viewer id="admin-ar" src="" camera-controls style="width:100%; height:240px; background:#000;"></model-viewer>
          </div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button id="test-load" class="btn btn-primary">โหลดโมเดล</button>
            <button id="convert-drive" class="btn btn-ghost">แปลง Google Drive → Direct</button>
          </div>
          <p class="small">ถ้าโมเดลหมุนติ้วๆ ให้ใช้ GitHub raw หรือแปลงเป็น direct download ตามคู่มือ</p>
        </div>
      </div>

      <div>
        <div class="card">
          <h3>รายการชุดข้อสอบ</h3>
          <div class="quiz-list" id="quiz-list"></div>
        </div>

        <div class="card" style="margin-top:12px;">
          <h3>จัดการ / วิเคราะห์</h3>
          <label>เลือกชุดข้อสอบ</label>
          <select id="select-quiz"></select>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button id="view-analytics" class="btn btn-primary">ดู Analytics</button>
            <button id="delete-quiz" class="btn btn-danger">ลบชุดข้อสอบ</button>
          </div>
          <div id="analytics-area" style="margin-top:12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -------------------------
    // Configuration
    // -------------------------
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmffRx9fH5-XI9aaUfepGWIMSreXKMSS3KsAl9d-0BF3qdEsFeQwg_WjSy4-Jsfe2E4Q/exec'; // <-- เปลี่ยนเป็น Web App URL ของคุณ

    // -------------------------
    // Helpers
    // -------------------------
    function $(id){ return document.getElementById(id); }
    function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }

    // -------------------------
    // Build question inputs
    // -------------------------
    function buildQuestions(n, existing = []) {
      const area = $('questions-area');
      area.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const q = existing[i] || { q: '', o: ['', '', '', ''], a: '', m: '' };
        const wrapper = el('div');
        wrapper.style.borderTop = '1px solid #eef5ff';
        wrapper.style.paddingTop = '8px';
        wrapper.innerHTML = `
          <label style="font-weight:600">ข้อที่ ${i+1}</label>
          <input class="q-text" placeholder="คำถาม" value="${escapeHtml(q.q)}" />
          <label>ตัวเลือก (คั่นบรรทัด)</label>
          <textarea class="q-opts" rows="3" placeholder="แต่ละบรรทัดเป็นตัวเลือก">${escapeHtml((q.o||[]).join('\n'))}</textarea>
          <label>คำตอบที่ถูกต้อง (พิมพ์ข้อความตรงกับตัวเลือก)</label>
          <input class="q-ans" placeholder="คำตอบที่ถูกต้อง" value="${escapeHtml(q.a)}" />
          <label>ลิงก์โมเดล .glb (direct/raw)</label>
          <input class="q-model" placeholder="https://..." value="${escapeHtml(q.m)}" />
        `;
        area.appendChild(wrapper);
      }
    }

    function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // initial
    buildQuestions(parseInt($('quiz-count').value,10) || 4);

    $('quiz-count').addEventListener('change', () => {
      const n = Math.max(1, parseInt($('quiz-count').value,10) || 1);
      buildQuestions(n);
    });

    // -------------------------
    // Save quiz
    // -------------------------
    $('save-quiz').addEventListener('click', async () => {
      const name = $('quiz-name').value.trim();
      if (!name) return alert('กรุณากรอกชื่อชุดข้อสอบ');
      const qEls = document.querySelectorAll('#questions-area > div');
      const questions = [];
      qEls.forEach((wrap, idx) => {
        const qText = wrap.querySelector('.q-text').value.trim();
        const opts = wrap.querySelector('.q-opts').value.split('\n').map(s=>s.trim()).filter(Boolean);
        const ans = wrap.querySelector('.q-ans').value.trim();
        const model = wrap.querySelector('.q-model').value.trim();
        questions.push({ q: qText, o: opts, a: ans, m: model });
      });

      const payload = { type: 'SAVE_QUIZ', id: null, name: name, questions: questions };
      try {
        const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data && data.status) {
          alert('บันทึกสำเร็จ: ' + data.id);
          loadQuizzes();
        } else {
          alert('บันทึกไม่สำเร็จ');
        }
      } catch (e) {
        console.error(e);
        alert('เกิดข้อผิดพลาดขณะบันทึก');
      }
    });

    // -------------------------
    // Load quizzes list
    // -------------------------
    async function loadQuizzes() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=list&t=${Date.now()}`);
        const data = await res.json();
        const list = $('quiz-list');
        const sel = $('select-quiz');
        list.innerHTML = '';
        sel.innerHTML = '<option value="">-- เลือกชุดข้อสอบ --</option>';
        (data || []).forEach(q => {
          const item = el('div','quiz-item');
          const left = el('div');
          left.innerHTML = `<strong>${q.name}</strong><div class="small">ID: ${q.id} • ข้อ: ${q.count}</div>`;
          const right = el('div');
          const btnEdit = el('button','btn btn-ghost'); btnEdit.textContent = 'แก้ไข';
          const btnDel = el('button','btn btn-danger'); btnDel.textContent = 'ลบ';
          btnEdit.addEventListener('click', ()=> loadQuizToForm(q.id));
          btnDel.addEventListener('click', ()=> deleteQuiz(q.id));
          right.appendChild(btnEdit); right.appendChild(btnDel);
          item.appendChild(left); item.appendChild(right);
          list.appendChild(item);

          const opt = el('option'); opt.value = q.id; opt.textContent = `${q.name} (${q.id})`;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
      }
    }
    loadQuizzes();

    // -------------------------
    // Load single quiz to form (edit)
    // -------------------------
    async function loadQuizToForm(id) {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getQuiz&id=${encodeURIComponent(id)}&t=${Date.now()}`);
        const data = await res.json();
        if (data && data.id) {
          $('quiz-name').value = data.name || '';
          const qs = data.questions || [];
          $('quiz-count').value = qs.length || 1;
          buildQuestions(qs.length || 1, qs);
          // store id on save button for update
          $('save-quiz').dataset.editId = data.id;
          alert('โหลดข้อมูลชุดข้อสอบเรียบร้อย สามารถแก้ไขแล้วกดบันทึก');
        } else {
          alert('ไม่พบชุดข้อสอบ');
        }
      } catch (e) {
        console.error(e);
        alert('โหลดข้อมูลล้มเหลว');
      }
    }

    // -------------------------
    // Delete quiz
    // -------------------------
    async function deleteQuiz(id) {
      if (!confirm('ต้องการลบชุดข้อสอบนี้จริงหรือไม่?')) return;
      try {
        const payload = { type: 'DELETE_QUIZ', id: id };
        const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data && data.status) {
          alert('ลบเรียบร้อย');
          loadQuizzes();
        } else {
          alert('ลบไม่สำเร็จ');
        }
      } catch (e) {
        console.error(e);
        alert('เกิดข้อผิดพลาดขณะลบ');
      }
    }

    // -------------------------
    // View analytics
    // -------------------------
    $('view-analytics').addEventListener('click', async () => {
      const id = $('select-quiz').value;
      if (!id) return alert('เลือกชุดข้อสอบก่อน');
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getQuizStatistics&id=${encodeURIComponent(id)}&t=${Date.now()}`);
        const data = await res.json();
        const area = $('analytics-area');
        if (data.error) {
          area.innerHTML = `<div class="small">ไม่มีข้อมูล</div>`;
          return;
        }
        area.innerHTML = `
          <div><strong>นักเรียนทั้งหมด:</strong> ${data.totalStudents}</div>
          <div><strong>คะแนนเฉลี่ย:</strong> ${data.avgScore}</div>
          <div><strong>ประเภทผู้เรียน:</strong> ${Object.entries(data.learnerTypes).map(([k,v])=>`${k}: ${v}`).join(', ')}</div>
        `;
      } catch (e) {
        console.error(e);
        alert('ดึงสถิติไม่สำเร็จ');
      }
    });

    // -------------------------
    // Test model load & convert Drive link
    // -------------------------
    $('test-load').addEventListener('click', () => {
      const url = $('test-model-url').value.trim();
      if (!url) return alert('วางลิงก์โมเดลก่อน');
      const mv = document.getElementById('admin-ar');
      try {
        mv.setAttribute('src', url);
        if (typeof mv.load === 'function') mv.load();
      } catch (e) {
        console.warn(e);
      }
    });

    $('convert-drive').addEventListener('click', () => {
      const url = $('test-model-url').value.trim();
      if (!url) return alert('วางลิงก์ Google Drive ก่อน');
      // try to extract file id
      const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (m && m[1]) {
        const id = m[1];
        const direct = `https://drive.google.com/uc?export=download&id=${id}`;
        $('test-model-url').value = direct;
        alert('แปลงลิงก์เป็น direct download แล้ว (วางลิงก์นี้ในช่องโมเดลของข้อสอบ)');
      } else {
        alert('ไม่พบ File ID ในลิงก์ กรุณาใช้ลิงก์แบบ https://drive.google.com/file/d/FILE_ID/view');
      }
    });

    // -------------------------
    // Clear form
    // -------------------------
    $('clear-form').addEventListener('click', () => {
      if (!confirm('ล้างฟอร์ม?')) return;
      $('quiz-name').value = '';
      $('quiz-count').value = 4;
      buildQuestions(4);
      delete $('save-quiz').dataset.editId;
    });

    // -------------------------
    // On load
    // -------------------------
    loadQuizzes();
  </script>
</body>
</html>
