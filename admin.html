<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Analytics - ครูผู้สอน</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.9);
            --primary: #8e44ad;
            --secondary: #3498db;
            --accent: #00d2ff;
            --success: #2ecc71;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; min-height: 100vh; color: var(--dark);
            background-attachment: fixed;
        }

        /* ✨ Canva Style Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(142, 68, 173, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(142, 68, 173, 0); } 100% { box-shadow: 0 0 0 0 rgba(142, 68, 173, 0); } }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; animation: slideIn 0.8s ease-out; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 30px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1, h2 { color: var(--primary); margin-top: 0; display: flex; align-items: center; gap: 10px; }

        input, textarea {
            width: 100%; padding: 14px 20px; border-radius: 12px;
            border: 2px solid #edf2f7; outline: none; transition: 0.3s;
            font-family: 'Sarabun', sans-serif; font-size: 16px; box-sizing: border-box;
            background: rgba(255,255,255,0.8);
        }
        input:focus { border-color: var(--primary); background: #fff; }

        .q-block { 
            display: grid; grid-template-columns: 1fr 350px; gap: 30px;
            padding: 25px; border-radius: 20px; background: white;
            margin-bottom: 25px; border: 1px solid #e2e8f0;
        }

        .btn {
            padding: 14px 28px; border-radius: 12px; border: none; font-weight: 600;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 8px; justify-content: center;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); }
        .btn-ai { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; width: 100%; margin-top: 10px; }
        .btn-update { background: var(--success); color: white; width: 100%; font-size: 1.2rem; margin-top: 30px; animation: pulse 2s infinite; }

        .preview-pane {
            width: 100%; height: 280px; background: radial-gradient(circle, #333 0%, #000 100%); 
            border-radius: 16px; overflow: hidden; position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #project-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .proj-item {
            background: white; padding: 25px; border-radius: 20px;
            border-left: 6px solid var(--primary); cursor: pointer; transition: 0.3s;
        }
        .proj-item:hover { transform: scale(1.03); border-left-color: var(--accent); }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>🪄 AR Intelligent Creator</h1>
        <div style="display: flex; gap: 15px;">
            <input type="text" id="proj-name" placeholder="ชื่อโปรเจกต์ เช่น วิทยาศาสตร์ ม.1 ชุดที่ 1">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width: 150px;">
            <button class="btn btn-primary" onclick="initQuiz()">🚀 สร้างชุดข้อสอบ</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>

    <div id="action-bar" style="display: none;">
        <button class="btn btn-update" onclick="saveToCloud()">💾 บันทึกและอัปเดตระบบอัจฉริยะ</button>
    </div>

    <div class="glass-card" style="margin-top: 50px;">
        <h2>📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list">กำลังโหลดข้อมูลจาก Google Sheets...</div>
    </div>
</div>

<script>
    // ✅ ลิงก์ Web App และ API Key ของคุณครู
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyy2F49wddKckN-yqgrhdSzCdKbmBgFevB6iol32bqD7T5Xn00aWITQlk6c59TIWMIGPA/exec';
    const API_KEY = 'AIzaSyD-x5oYoiNhClunMwiVE2f5Tg4IvN3V1Lg';

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';
        if(!n || n <= 0) return alert("กรุณาระบุจำนวนข้อครับ");

        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block" id="block-${i}">
                    <div>
                        <h3 style="color:var(--primary)">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="พิมพ์โจทย์คำถามวิเคราะห์..."></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก (ก, ข, ค, ง)">
                        <input type="text" id="a-${i}" placeholder="เฉลยที่ถูกต้อง">
                        <div style="background:#f8f9fa; padding:15px; border-radius:12px; margin-top:10px;">
                            <label style="font-size:14px; font-weight:600;">🤖 AI AR Search:</label>
                            <input type="text" id="p-${i}" placeholder="ระบุสิ่งที่อยากได้ (เช่น ระบบสุริยะ 3D)" style="margin-bottom:5px;">
                            <button class="btn btn-ai" onclick="generateModel(${i})">✨ ให้ AI ค้นหาโมเดลให้</button>
                        </div>
                        <input type="text" id="m-${i}" placeholder="URL ลิงก์ .glb" style="margin-top:10px" onchange="preview(${i})">
                    </div>
                    <div>
                        <div class="preview-pane">
                            <model-viewer id="v-${i}" camera-controls ar shadow-intensity="1" auto-rotate></model-viewer>
                        </div>
                        <p style="font-size:12px; color:#666; text-align:center; margin-top:8px;">ตรวจสอบการแสดงผล AR ก่อนบันทึก</p>
                    </div>
                </div>
            `;
        }
        document.getElementById('action-bar').style.display = 'block';
        window.scrollTo({ top: 500, behavior: 'smooth' });
    }

    async function generateModel(i) {
        const p = document.getElementById(`p-${i}`).value;
        if(!p) return alert("กรุณาระบุหัวข้อให้ AI ครับ");
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="loader"></span> กำลังค้นหาคลังโมเดล...`;
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Find a direct URL to a .glb 3D model from KhronosGroup for: ${p}. Return ONLY the raw URL link. No text.` }] }] })
            });
            const data = await res.json();
            const url = data.candidates[0].content.parts[0].text.trim();
            document.getElementById(`m-${i}`).value = url;
            preview(i);
        } catch(e) { 
            alert("ขออภัย AI หาโมเดลนี้ไม่เจอ ลองระบุเป็นภาษาอังกฤษดูครับ"); 
        } finally {
            btn.innerHTML = originalText;
        }
    }

    function preview(i) {
        const url = document.getElementById(`m-${i}`).value;
        document.getElementById(`v-${i}`).src = url;
    }

    async function saveToCloud() {
        const n = document.getElementById('q-count').value;
        const qs = [];
        for(let i=0; i<n; i++) {
            qs.push({
                q: document.getElementById(`q-${i}`).value,
                o: document.getElementById(`o-${i}`).value.split(','),
                a: document.getElementById(`a-${i}`).value,
                m: document.getElementById(`m-${i}`).value
            });
        }
        
        const payload = {
            type: "SAVE_QUIZ",
            id: document.getElementById('current-id').value,
            name: document.getElementById('proj-name').value,
            questions: qs
        };

        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            alert("🎉 บันทึกสำเร็จ! ID สำหรับนักเรียนคือ: " + result.id);
            loadList();
        } catch(e) {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets");
        }
    }

    async function loadList() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=list");
            const list = await res.json();
            document.getElementById('project-list').innerHTML = list.map(p => `
                <div class="proj-item" onclick="edit('${p.id}')">
                    <h3 style="margin:0 0 10px 0; color:var(--primary)">${p.name}</h3>
                    <p style="margin:0; font-size:14px; color:#666;">
                        🆔 รหัส: <b>${p.id}</b><br>
                        📝 จำนวน: ${p.count} ข้อ
                    </p>
                </div>
            `).join('');
        } catch(e) {
            document.getElementById('project-list').innerHTML = "ยังไม่พบข้อมูลโปรเจกต์";
        }
    }

    async function edit(id) {
        const res = await fetch(SCRIPT_URL + "?action=getQuiz&id=" + id);
        const data = await res.json();
        document.getElementById('current-id').value = id;
        document.getElementById('proj-name').value = data.name;
        document.getElementById('q-count').value = data.questions.length;
        initQuiz();
        data.questions.forEach((q, i) => {
            document.getElementById(`q-${i}`).value = q.q;
            document.getElementById(`o-${i}`).value = q.o.join(',');
            document.getElementById(`a-${i}`).value = q.a;
            document.getElementById(`m-${i}`).value = q.m;
            preview(i);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadList();
</script>
</body>
</html>
