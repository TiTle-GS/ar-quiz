<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Admin v7.0 - Drive Mode with Loading</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #8b5cf6; --g: #10b981; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f7ff; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #fff; }
        .btn { padding: 12px 24px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Sarabun'; font-size: 14px; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, var(--p), var(--s)); color: white; }
        .btn-check { background: #4f46e5; color: white; width: 100%; margin-top: 10px; }
        .btn-update { background: var(--g); color: white; width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 18px; }
        .q-block { display: grid; grid-template-columns: 1fr 350px; gap: 25px; padding: 25px; background: white; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .preview-pane { background: #000; border-radius: 18px; height: 320px; overflow: hidden; border: 4px solid #f1f5f9; position: relative; display: flex; align-items: center; justify-content: center; }
        .drive-box { background: #f0fdf4; padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px dashed var(--g); }
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-top: 5px; font-family: 'Sarabun'; box-sizing: border-box; }
        
        /* 🌀 Loading Spinner */
        .loader-ui { display: none; flex-direction: column; align-items: center; color: white; gap: 15px; z-index: 10; position: absolute; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--p); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2 style="color:var(--p); margin-top:0;">🪄 AR Quiz Creator (Google Drive Version)</h2>
        <div style="display: flex; gap: 12px;">
            <input type="text" id="proj-name" placeholder="ชื่อวิชา / ชุดข้อสอบ">
            <input type="number" id="q-count" placeholder="จำนวนข้อ" style="width:120px;">
            <button class="btn btn-primary" onclick="initQuiz()">🚀 เริ่มสร้างข้อสอบ</button>
        </div>
        <input type="hidden" id="current-id">
    </div>

    <div id="quiz-area"></div>
    <div id="action-bar" style="display:none; margin-bottom: 40px;">
        <button id="save-btn" class="btn btn-update" onclick="saveToCloud()">💾 บันทึกชุดข้อสอบลง Google Sheets</button>
    </div>

    <div class="glass-card">
        <h2 style="margin-top:0;">📚 คลังข้อสอบของคุณครู</h2>
        <div id="project-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmffRx9fH5-XI9aaUfepGWIMSreXKMSS3KsAl9d-0BF3qdEsFeQwg_WjSy4-Jsfe2E4Q/exec';

    window.onload = loadList;

    function initQuiz() {
        const n = document.getElementById('q-count').value;
        const area = document.getElementById('quiz-area');
        if(!n || n <= 0) return alert("โปรดระบุจำนวนข้อ");
        area.innerHTML = '';
        for(let i=0; i<n; i++) {
            area.innerHTML += `
                <div class="glass-card q-block">
                    <div>
                        <h3 style="color:var(--p)">ข้อที่ ${i+1}</h3>
                        <textarea id="q-${i}" placeholder="โจทย์คำถาม..."></textarea>
                        <input type="text" id="o-${i}" placeholder="ตัวเลือก ก,ข,ค,ง (แยกด้วยคอมม่า)">
                        <input type="text" id="a-${i}" placeholder="คำตอบที่ถูกต้อง">
                        
                        <div class="drive-box">
                            <label style="font-weight:600; color:var(--g); font-size:14px;">🔗 วางลิงก์ Google Drive (ต้องแชร์เป็น Anyone)</label>
                            <input type="text" id="raw-link-${i}" placeholder="https://drive.google.com/file/d/...">
                            <input type="hidden" id="m-${i}">
                            <button class="btn btn-check" id="btn-check-${i}" onclick="processModel(${i})">🔍 ตรวจสอบลิงก์โมเดล</button>
                        </div>
                    </div>
                    <div class="preview-pane" id="pane-${i}">
                        <div class="loader-ui" id="loader-${i}">
                            <div class="spinner"></div>
                            <span>กำลังโหลดโมเดล 3D...</span>
                        </div>
                        <model-viewer id="v-${i}" camera-controls ar shadow-intensity="1" style="width:100%; height:100%;"></model-viewer>
                    </div>
                </div>`;
        }
        document.getElementById('action-bar').style.display = 'block';
    }

    function processModel(i) {
        const rawUrl = document.getElementById(`raw-link-${i}`).value;
        const btn = document.getElementById(`btn-check-${i}`);
        const loader = document.getElementById(`loader-${i}`);
        const viewer = document.getElementById(`v-${i}`);

        if (!rawUrl.includes("drive.google.com")) {
            return alert("โปรดวางลิงก์จาก Google Drive ให้ถูกต้องครับ");
        }

        // แสดง Loading
        loader.style.display = 'flex';
        btn.disabled = true;
        btn.innerHTML = "⌛ กำลังประมวลผล...";

        try {
            const parts = rawUrl.split('/d/');
            if (parts.length > 1) {
                const fileId = parts[1].split('/')[0].split('?')[0].split('&')[0];
                const directLink = `https://docs.google.com/uc?export=download&id=${fileId}`;
                
                document.getElementById(`m-${i}`).value = directLink;
                viewer.src = directLink;

                // เมื่อโมเดลโหลดเสร็จ หรือ เกิดข้อผิดพลาด
                viewer.addEventListener('load', () => {
                    loader.style.display = 'none';
                    btn.disabled = false;
                    btn.innerHTML = "✅ ตรวจสอบสำเร็จ (โมเดลขึ้นแล้ว)";
                    btn.style.background = "var(--g)";
                });

                viewer.addEventListener('error', () => {
                    loader.style.display = 'none';
                    btn.disabled = false;
                    btn.innerHTML = "❌ โหลดไม่สำเร็จ (เช็คการแชร์ไฟล์)";
                    btn.style.background = "#ef4444";
                    alert("โมเดลไม่ขึ้น! โปรดตรวจสอบว่าคุณครูแชร์ไฟล์แบบ 'Anyone with the link' หรือยัง?");
                });
            }
        } catch (e) {
            alert("ลิงก์ไม่ถูกต้อง");
            loader.style.display = 'none';
            btn.disabled = false;
        }
    }

    async function saveToCloud() {
        const btn = document.getElementById('save-btn');
        const count = document.getElementById('q-count').value;
        const questions = [];
        for(let i=0; i<count; i++) {
            const mVal = document.getElementById(`m-${i}`).value;
            if(!mVal) return alert(`คุณครูยังไม่ได้ตรวจสอบโมเดลในข้อที่ ${i+1} ครับ`);
            questions.push({
                q: document.getElementById(`q-${i}`).value,
                o: document.getElementById(`o-${i}`).value.split(','),
                a: document.getElementById(`a-${i}`).value,
                m: mVal
            });
        }
        btn.disabled = true; btn.innerHTML = "💾 กำลังบันทึกลงฐานข้อมูล...";
        try {
