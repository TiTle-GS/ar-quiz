<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Education Quiz</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --primary: #FF5722; /* สีส้มที่คุณครูชอบ */
            --secondary: #2196F3;
            --dark: #1a1a1a;
        }

        body {
            margin: 0;
            font-family: 'Sarabun', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ส่วนแสดงผล AR (ครึ่งบน) */
        .ar-viewport {
            flex: 1.2;
            position: relative;
            background: #000;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        /* ปุ่มเริ่มส่องโลกจริง */
        .ar-button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* ส่วนของข้อสอบ (ครึ่งล่าง) */
        .quiz-container {
            flex: 1;
            background: white;
            padding: 20px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 20;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .option:active {
            transform: scale(0.98);
            background: #e3f2fd;
            border-color: var(--secondary);
        }

        .option-num {
            background: var(--secondary);
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="ar-viewport">
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor"
            camera-controls 
            auto-rotate 
            shadow-intensity="1">
            
            <button slot="ar-button" class="ar-button">
                📸 กดเพื่อส่องโลกจริง (ไจโร)
            </button>
        </model-viewer>
    </div>

    <div class="quiz-container">
        <div class="question">จากโมเดล 3D ที่ส่องเห็น นักเรียนคิดว่าเป็นวัตถุใด?</div>
        
        <div class="option" onclick="answer(1)">
            <div class="option-num">1</div>
            <div>นักดำน้ำใต้ทะเล</div>
        </div>

        <div class="option" onclick="answer(2)">
            <div class="option-num">2</div>
            <div>นักบินอวกาศ (Astronaut)</div>
        </div>

        <div class="option" onclick="answer(3)">
            <div class="option-num">3</div>
            <div>หุ่นยนต์กู้ภัย</div>
        </div>
    </div>

    <script>
        function answer(num) {
            if(num === 2) {
                alert("เก่งมากครับคุณครู! คำตอบถูกต้อง 🎉");
            } else {
                alert("ยังไม่ถูกครับ ลองส่องดูใหม่อีกทีนะ!");
            }
        }
    </script>
</body>
</html>
