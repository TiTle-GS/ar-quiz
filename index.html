<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Quiz Online - สำหรับนักเรียน</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-color: #0288d1; --bg-color: #f0f4f8; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg-color); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .quiz-item { background: #fff; border: 2px solid var(--main-color); padding: 15px; border-radius: 15px; margin-bottom: 12px; cursor: pointer; font-weight: 600; color: var(--main-color); transition: 0.3s; }
        .quiz-item:hover { background: var(--main-color); color: white; transform: translateY(-2px); }
        #viewer-container { width: 100%; height: 350px; background: radial-gradient(#444, #000); border-radius: 15px; margin-bottom: 20px; position: relative; }
        .choice-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 12px; background: white; cursor: pointer; font-size: 17px; font-family: 'Sarabun'; transition: 0.2s; }
        .choice-btn:hover { border-color: var(--main-color); background: #e3f2fd; }
        .score-badge { display: inline-block; padding: 5px 15px; background: #e1f5fe; color: var(--main-color); border-radius: 20px; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-page">
        <div class="card">
            <h1 style="color: var(--main-color); margin-top:0;">🌟 AR Learning Quiz</h1>
            <p>กรุณาเลือกชุดข้อสอบที่คุณครูกำหนด</p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <div id="quiz-list">กำลังเชื่อมต่อคลังข้อสอบ...</div>
        </div>
    </div>

    <div id="quiz-page" style="display:none;">
        <div class="card">
            <div class="score-badge" id="progress-text">ข้อที่ 1/1</div>
            <div id="viewer-container">
                <model-viewer id="ar-viewer" camera-controls ar shadow-intensity="1" auto-rotate style="width:100%; height:100%;"></model-viewer>
            </div>
            <h2 id="question-text" style="margin: 15px 0;">โจทย์คำถามกำลังโหลด...</h2>
            <div id="options-area"></div>
        </div>
    </div>
</div>

<script>
    // 🚩 Config เชื่อมต่อกับ Firebase สิงคโปร์ (ตามข้อมูลของคุณครู)
    const firebaseConfig = {
        apiKey: "AIzaSyDBvaBLaqywJ-J3J6hH_UwyF-WmultPim4",
        authDomain: "ar-quizz.firebaseapp.com",
        projectId: "ar-quizz",
        databaseURL: "https://ar-quizz-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "ar-quizz.firebasestorage.app",
        messagingSenderId: "151328581741",
        appId: "1:151328581741:web:d148eaa15b7a24b0dcf764"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 1. ระบบดึงคลังข้อสอบ ---
    const quizListArea = document.getElementById('quiz-list');

    db.ref('quizzes').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            quizListArea.innerHTML = "<p style='color:red;'>ขณะนี้ยังไม่มีข้อสอบในระบบ</p>";
            return;
        }

        quizListArea.innerHTML = ''; // ล้าง Loading
        for (let key in data) {
            const div = document.createElement('div');
            div.className = 'quiz-item';
            div.innerHTML = `📝 ${data[key].name}`;
            div.onclick = () => startQuiz(data[key].questions);
            quizListArea.appendChild(div);
        }
    });

    // --- 2. ระบบจัดการการเล่น ---
    let questions = [];
    let currentIdx = 0;

    function startQuiz(quizData) {
        questions = quizData;
        currentIdx = 0;
        document.getElementById('setup-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIdx >= questions.length) {
            alert("🎊 ยินดีด้วย! คุณทำข้อสอบครบทุกข้อแล้ว");
            location.reload(); // กลับหน้าหลัก
            return;
        }

        const q = questions[currentIdx];
        document.getElementById('progress-text').innerText = `ข้อที่ ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('ar-viewer').src = q.m;

        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';

        q.o.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.trim();
            btn.onclick = () => checkAnswer(choice.trim(), q.a.trim());
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(userAns, correctAns) {
        if (userAns === correctAns) {
            alert("✅ ถูกต้องจ้า!");
            currentIdx++;
            loadQuestion();
        } else {
            alert("❌ ยังไม่ถูกนะ ลองพิจารณาโมเดล 3D อีกครั้งครับ");
        }
    }
</script>
</body>
</html>
