<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Exam - สำหรับนักเรียน</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #764ba2; --s: #667eea; --glass: rgba(255,255,255,0.9); }
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); animation: fadeInUp 0.6s ease; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .welcome-screen { text-align: center; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee; margin: 10px 0; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p); }

        .btn { background: linear-gradient(45deg, var(--p), var(--s)); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; margin-top: 15px; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

        .progress-container { width: 100%; background: #eee; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--p); width: 0%; transition: 0.5s; }

        .ar-viewer { width: 100%; height: 350px; background: radial-gradient(circle, #444 0%, #000 100%); border-radius: 20px; margin-bottom: 20px; }
        .option-btn { background: white; border: 2px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; text-align: left; font-size: 16px; }
        .option-btn:hover { border-color: var(--p); background: #f8f0ff; }
        .option-btn.selected { background: var(--p); color: white; border-color: var(--p); }

        #analytics-box { display: none; text-align: center; }
        .score-circle { width: 120px; height: 120px; line-height: 120px; border-radius: 50%; background: var(--p); color: white; font-size: 40px; margin: 20px auto; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="lobby" class="glass-card welcome-screen">
        <h1 style="color:var(--p)">✨ AR Intelligent Exam</h1>
        <p>ยินดีต้อนรับนักเรียน เข้าสู่การทดสอบโลกเสมือน</p>
        <input type="text" id="std-name" placeholder="ชื่อ-นามสกุลของคุณ">
        <input type="text" id="quiz-id" placeholder="รหัสข้อสอบ (ที่ได้รับจากคุณครู)">
        <button class="btn" onclick="startExam()">เริ่มการทดสอบ</button>
    </div>

    <div id="quiz-screen" class="glass-card" style="display:none;">
        <div class="progress-container"><div id="p-bar" class="progress-bar"></div></div>
        <div style="display:flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 10px;">
            <span id="q-number">ข้อที่ 1/3</span>
            <span id="timer">เวลา: 0 วินาที</span>
        </div>
        <h2 id="q-text" style="color:var(--p); margin-top:0;">กำลังโหลดคำถาม...</h2>
        
        <model-viewer id="ar-view" class="ar-viewer" camera-controls ar shadow-intensity="1" auto-rotate></model-viewer>
        
        <div id="options-area"></div>
        <button class="btn" id="next-btn" onclick="submitAnswer()" style="display:none;">ส่งคำตอบ / ข้อถัดไป</button>
    </div>

    <div id="result-screen" class="glass-card" style="display:none; text-align: center;">
        <h2 style="color:var(--p)">ส่งข้อสอบสำเร็จ!</h2>
        <div class="score-circle" id="final-score">0</div>
        <p id="ai-feedback">AI กำลังวิเคราะห์พฤติกรรมการเรียนรู้ของคุณ...</p>
        <button class="btn" onclick="location.reload()">ทำใหม่</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmffRx9fH5-XI9aaUfepGWIMSreXKMSS3KsAl9d-0BF3qdEsFeQwg_WjSy4-Jsfe2E4Q/exec';
    
    let quizData = null;
    let currentIdx = 0;
    let score = 0;
    let logs = [];
    
    // Analytics Variables
    let qStartTime, arStartTime, isARViewing = false;
    let currentLog = { time: 0, arTime: 0, changes: 0, interacts: 0 };

    async function startExam() {
        const name = document.getElementById('std-name').value;
        const id = document.getElementById('quiz-id').value;
        if(!name || !id) return alert("กรุณากรอกข้อมูลให้ครบครับ");

        try {
            const res = await fetch(`${SCRIPT_URL}?action=getQuiz&id=${id}`);
            quizData = await res.json();
            if(quizData.error) throw new Error();
            
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        } catch(e) { alert("ไม่พบรหัสข้อสอบนี้ โปรดเช็คอีกครั้งครับ"); }
    }

    function loadQuestion() {
        const q = quizData.questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('q-number').innerText = `ข้อที่ ${currentIdx + 1}/${quizData.questions.length}`;
        document.getElementById('ar-view').src = q.m;
        
        const optArea = document.getElementById('options-area');
        optArea.innerHTML = '';
        q.o.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt.trim();
            btn.onclick = () => selectOption(btn, opt.trim());
            optArea.appendChild(btn);
        });

        // Reset Analytics for this question
        qStartTime = Date.now();
        currentLog = { time: 0, arTime: 0, changes: 0, interacts: 0, order: currentIdx + 1 };
        document.getElementById('next-btn').style.display = 'none';
        
        // Progress bar
        document.getElementById('p-bar').style.width = `${((currentIdx) / quizData.questions.length) * 100}%`;
    }

    function selectOption(el, val) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        currentLog.selected = val;
        currentLog.changes++;
        document.getElementById('next-btn').style.display = 'block';
    }

    // Track AR Interaction
    document.getElementById('ar-view').addEventListener('camera-change', () => {
        currentLog.interacts++;
    });

    async function submitAnswer() {
        const q = quizData.questions[currentIdx];
        currentLog.time = (Date.now() - qStartTime) / 1000;
        if(currentLog.selected === q.a.trim()) score++;
        
        logs.push({...currentLog});

        if(currentIdx < quizData.questions.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            finishExam();
        }
    }

    async function finishExam() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        const payload = {
            type: "SUBMIT_ANALYTICS",
            student: document.getElementById('std-name').value,
            projectId: document.getElementById('quiz-id').value,
            score: score + "/" + quizData.questions.length,
            logs: logs
        };

        const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        document.getElementById('ai-feedback').innerText = "AI สรุปพฤติกรรม: " + result.summary;
    }
</script>
</body>
</html>
