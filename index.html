<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Learning Analytics V2</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #673AB7; --accent: #FFC107; }
        body { font-family: 'Sarabun', sans-serif; margin: 0; background: #fafafa; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: bold; }
        #ar-container { height: 45vh; background: #000; position: relative; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        .quiz-box { padding: 20px; background: white; border-radius: 25px 25px 0 0; margin-top: -20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); min-height: 45vh; }
        .opt { display: block; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .opt.selected { border-color: var(--primary); background: #f3e5f5; }
        .btn { background: #4CAF50; color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .ar-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; z-index: 10; }
        #login { position: fixed; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login">
    <h2 style="color:var(--primary)">ระบบสอบ AR (แบบ 3 มิติ)</h2>
    <input type="text" id="std-name" placeholder="ชื่อ-นามสกุลนักเรียน" style="padding:15px; width:80%; border:1px solid #ccc; border-radius:10px; margin-bottom:20px;">
    <button class="btn" onclick="start()" style="width:85%">เริ่มทำข้อสอบ</button>
</div>

<div class="header" id="q-head">ข้อที่ 1/3</div>

<div id="ar-container">
    <model-viewer id="v" src="" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button slot="ar-button" class="ar-btn">📲 เปิดกล้องส่องโลกจริง</button>
    </model-viewer>
</div>

<div class="quiz-box">
    <h3 id="q-text">โหลดโจทย์...</h3>
    <div id="opts"></div>
    <button id="next" class="btn" onclick="handleNext()">ข้อถัดไป</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxUfoY263Dvn625Njl2oGxbFFnPrGgOSsxNkEjQxjbrRpvYDKjIj7q8fBeGVpuoeNh0MQ/exec';
    const questions = [
        { q: "1. จากโมเดลนักบินอวกาศ อุปกรณ์ที่หลังคืออะไร?", m: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", o: ["กระเป๋าเดินทาง", "ถังออกซิเจน", "ร่มชูชีพ"], a: "ถังออกซิเจน" },
        { q: "2. โมเดลหัวใจมนุษย์นี้ ห้องหัวใจล่างซ้ายมีขนาดอย่างไร?", m: "https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb", o: ["ใหญ่และหนาที่สุด", "เล็กที่สุด", "ไม่มีกล้ามเนื้อ"], a: "ใหญ่และหนาที่สุด" },
        { q: "3. วัตถุโบราณนี้ทำจากวัสดุประเภทใดเป็นหลัก?", m: "https://modelviewer.dev/shared-assets/models/Canoe.glb", o: ["เหล็ก", "ไม้", "พลาสติก"], a: "ไม้" }
    ];

    let current = 0, name = "", score = 0, history = [];
    let qStart, arStart, viewARTot = 0, changeCnt = 0, interactCnt = 0, sel = "";

    function start() {
        name = document.getElementById('std-name').value;
        if(!name) return alert("ใส่ชื่อด้วยจ้า");
        document.getElementById('login').style.display = 'none';
        loadQ();
    }

    function loadQ() {
        const q = questions[current];
        document.getElementById('q-head').innerText = `ข้อที่ ${current+1}/3`;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('v').src = q.m;
        const oDiv = document.getElementById('opts');
        oDiv.innerHTML = "";
        q.o.forEach(opt => {
            oDiv.innerHTML += `<div class="opt" onclick="select(this, '${opt}')">${opt}</div>`;
        });
        qStart = Date.now();
        viewARTot = 0; changeCnt = 0; interactCnt = 0; sel = "";
    }

    function select(el, val) {
        if(sel && sel !== val) changeCnt++;
        sel = val;
        document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
    }

    const v = document.getElementById('v');
    v.addEventListener('camera-change', () => interactCnt++);
    v.addEventListener('ar-status', (e) => {
        if(e.detail.status === "session-started") arStart = Date.now();
        if(e.detail.status === "not-presenting" && arStart) {
            viewARTot += Math.floor((Date.now() - arStart)/1000);
            arStart = null;
        }
    });

    function handleNext() {
        if(!sel) return alert("เลือกคำตอบก่อนนะ");
        if(sel === questions[current].a) score++;
        
        history.push({ t: Math.floor((Date.now()-qStart)/1000), c: changeCnt, i: interactCnt, v: viewARTot });

        if(current < 2) {
            current++; loadQ();
        } else {
            sendData();
        }
    }

    function sendData() {
        document.body.innerHTML = "<div style='padding:50px; text-align:center;'><h2>กำลังส่งคะแนน...</h2></div>";
        const sum = history.reduce((a, b) => ({ t: a.t+b.t, c: a.c+b.c, i: a.i+b.i, v: a.v+b.v }));
        const data = {
            studentName: name,
            totalScore: score,
            avgTimeSpent: Math.floor(sum.t/3),
            totalChangeCount: sum.c,
            totalInteractAR: Math.floor(sum.i/5),
            totalViewARTime: sum.v,
            behaviorSummary: `ส่อง AR ทั้งหมด ${sum.v} วินาที และมีการลังเลเปลี่ยนคำตอบ ${sum.c} ครั้ง`
        };
        fetch(scriptURL, { method: 'POST', body: JSON.stringify(data), mode: 'no-cors' })
        .then(() => alert("บันทึกสำเร็จ!"))
        .finally(() => location.reload());
    }
</script>
</body>
</html>
